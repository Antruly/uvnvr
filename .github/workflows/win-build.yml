name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/win-build-audio
      - feat/ai-pipeline

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 (MinGW)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libuv
            mingw-w64-x86_64-zlib
            unzip
            zip

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Fetch dependencies
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/uvcpp.zip" \
            "https://github.com/Antruly/libuvcpp/releases/download/v1.8.1/libuvcpp-1.8.1-mingw-x64.zip"
          unzip -q "$RUNNER_TEMP/uvcpp.zip" -d "$RUNNER_TEMP/uvcpp"
          curl -fL --retry 3 -o "$RUNNER_TEMP/ffmpeg.zip" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          unzip -q "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/ffmpeg"

      - name: Build backend
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVNVR_LIBUVCPP_ROOT="$RUNNER_TEMP/uvcpp/libuvcpp-1.8.1-mingw-x64"
          cmake --build build --parallel

      - name: Private-protocol SDK smoke test
        run: |
          set -euo pipefail
          # The prebuilt libuvcpp DLL is not installed under /mingw64, so put
          # the release archive's bin directory on PATH for the SDK and server.
          export PATH="$RUNNER_TEMP/uvcpp/libuvcpp-1.8.1-mingw-x64/bin:/mingw64/bin:$PATH"
          DATA_DIR="$RUNNER_TEMP/sdkdata"
          rm -rf "$DATA_DIR"
          mkdir -p "$DATA_DIR"
          DATA_ARG="$(cygpath -w "$DATA_DIR")"
          ./build/uvnvr.exe --port 18099 --private-port 15159 \
            --data-dir "$DATA_ARG" --log-level info \
            > "$RUNNER_TEMP/uvnvr-sdk-server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 120); do
            if curl -fsS --max-time 2 \
                http://127.0.0.1:18099/api/v1/setup/status >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::the private-protocol test server did not become ready"
            cat "$RUNNER_TEMP/uvnvr-sdk-server.log"
            exit 1
          fi
          curl -fsS --max-time 10 -H 'Content-Type: application/json' \
            -d '{"password":"SdkSmoke123!","confirmPassword":"SdkSmoke123!","timezone":"UTC"}' \
            http://127.0.0.1:18099/api/v1/setup >/dev/null

          run_case() {
            name="$1"
            shift
            out="$RUNNER_TEMP/sdk-$name.out"
            set +e
            timeout --kill-after=5 30 "$@" > "$out" 2>&1
            rc=$?
            set -e
            echo "== $name (exit $rc) =="
            cat "$out"
            if [ "$rc" -ne 0 ]; then
              echo "::error::sample_basic ($name) exited with $rc"
              cat "$RUNNER_TEMP/uvnvr-sdk-server.log"
              exit 1
            fi
            if ! grep -q 'channels:' "$out"; then
              echo "::error::sample_basic ($name) did not print channels:"
              cat "$RUNNER_TEMP/uvnvr-sdk-server.log"
              exit 1
            fi
            if ! grep -q "^connected via $name\$" "$out"; then
              echo "::error::sample_basic ($name) did not connect via $name"
              cat "$RUNNER_TEMP/uvnvr-sdk-server.log"
              exit 1
            fi
          }

          # QUIC first (the server listens on TCP and QUIC on the same port),
          # then the explicit TCP-only path.
          run_case quic ./build/uvnvr_sample_basic.exe \
            127.0.0.1 15159 admin 'SdkSmoke123!'
          run_case tcp env UVNVR_SDK_TRANSPORT=tcp \
            ./build/uvnvr_sample_basic.exe 127.0.0.1 15159 admin 'SdkSmoke123!'

          cleanup
          trap - EXIT

      - name: Stage portable tree
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ROOT="$(pwd)"
          OUT="$ROOT/dist-packages/uvnvr-${VERSION}-windows-x64"
          mkdir -p "$OUT/bin" "$OUT/share/uvnvr/frontend/dist"
          cp build/uvnvr.exe "$OUT/bin/"
          FFMPEG_EXE="$(find "$RUNNER_TEMP/ffmpeg" -type f -name ffmpeg.exe | head -1)"
          if "$FFMPEG_EXE" -buildconf 2>/dev/null | grep -q -- '--enable-gpl'; then
            echo "refusing to package a GPL FFmpeg build" >&2
            exit 1
          fi
          cp "$FFMPEG_EXE" "$OUT/bin/ffmpeg.exe"
          cp -a frontend/dist/. "$OUT/share/uvnvr/frontend/dist/"
          cp packaging/windows/uvnvr.portable.json "$OUT/uvnvr.json"
          cp LICENSE THIRD_PARTY_NOTICES.md "$OUT/"
          cp /mingw64/bin/libuvcpp.dll "$OUT/bin/" 2>/dev/null || true
          for dll in libuv.dll libssl-3-x64.dll libcrypto-3-x64.dll libwinpthread-1.dll libgcc_s_seh-1.dll libstdc++-6.dll zlib1.dll; do
            if [ -f "/mingw64/bin/$dll" ]; then cp "/mingw64/bin/$dll" "$OUT/bin/"; fi
          done
          if [ -f "$RUNNER_TEMP/uvcpp/libuvcpp-1.8.1-mingw-x64/bin/libuvcpp.dll" ]; then
            cp "$RUNNER_TEMP/uvcpp/libuvcpp-1.8.1-mingw-x64/bin/libuvcpp.dll" "$OUT/bin/"
          fi
          # Copy every MinGW runtime DLL the executable actually links.
          ldd build/uvnvr.exe | awk '/=> \/mingw64/ {print $3}' | while read -r dll; do
            [ -n "$dll" ] && cp -L "$dll" "$OUT/bin/"
          done
          # Private-protocol C SDK: DLL, import library, header and samples.
          if [ -f build/libuvnvr_sdk.dll ]; then
            mkdir -p "$OUT/sdk/include" "$OUT/sdk/lib"
            cp build/libuvnvr_sdk.dll "$OUT/bin/"
            cp build/libuvnvr_sdk.dll.a "$OUT/sdk/lib/" 2>/dev/null || true
            cp sdk/include/uvnvr_sdk.h "$OUT/sdk/include/"
            cp build/uvnvr_sample_basic.exe build/uvnvr_sample_live.exe \
               build/uvnvr_sample_download.exe "$OUT/sdk/" 2>/dev/null || true
          else
            echo "::warning::the private-protocol SDK was not built on Windows"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: uvnvr-sdk-windows-x64
          path: |
            build/libuvnvr_sdk.dll
            build/libuvnvr_sdk.dll.a
            sdk/include/uvnvr_sdk.h
            build/uvnvr_sample_*.exe
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        with:
          name: uvnvr-windows-x64
          path: dist-packages/uvnvr-*-windows-x64/**
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: uvnvr-exe-only
          path: build/uvnvr.exe
          if-no-files-found: error
