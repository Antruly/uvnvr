name: Build packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            libuvcpp: linux-x64
            ffmpeg: linux64
            deb_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            libuvcpp: linux-arm64
            ffmpeg: linuxarm64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9] ]]; then VERSION="$(cat VERSION)"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Fetch libuvcpp
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/uvcpp.zip" \
            "https://github.com/Antruly/libuvcpp/releases/download/v1.8.1/libuvcpp-1.8.1-${{ matrix.libuvcpp }}.zip"
          unzip -q "$RUNNER_TEMP/uvcpp.zip" -d "$RUNNER_TEMP/uvcpp"

      - name: Fetch static LGPL FFmpeg
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-${{ matrix.ffmpeg }}-lgpl-8.1.tar.xz"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -C "$RUNNER_TEMP/ffmpeg" -xf "$RUNNER_TEMP/ffmpeg.tar.xz"

      - name: Install build tools
        run: sudo apt-get install -y --no-install-recommends ninja-build pkg-config unzip libuv1-dev libssl-dev rpm

      - name: Build backend
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVNVR_LIBUVCPP_ROOT="$RUNNER_TEMP/uvcpp/libuvcpp-1.8.1-${{ matrix.libuvcpp }}"
          cmake --build build --parallel

      - name: Package
        run: |
          FFMPEG_BIN="$(find "$RUNNER_TEMP/ffmpeg" -type f -name ffmpeg | head -1)"
          chmod +x packaging/linux/build-package.sh
          packaging/linux/build-package.sh \
            --build build \
            --libuvcpp "$RUNNER_TEMP/uvcpp/libuvcpp-1.8.1-${{ matrix.libuvcpp }}" \
            --ffmpeg "$FFMPEG_BIN" \
            --arch "${{ matrix.arch }}" \
            --version "${{ steps.version.outputs.version }}" \
            --out dist-packages

      - uses: actions/upload-artifact@v7
        with:
          name: uvnvr-linux-${{ matrix.arch }}
          path: |
            dist-packages/*.deb
            dist-packages/*.rpm
            dist-packages/*.tar.gz
          if-no-files-found: error

  windows-x64:
    name: Windows x64 (MinGW)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9] ]]; then VERSION="$(cat VERSION)"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libuv
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-nsis
            unzip
            zip

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Fetch dependencies
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/uvcpp.zip" \
            "https://github.com/Antruly/libuvcpp/releases/download/v1.8.1/libuvcpp-1.8.1-mingw-x64.zip"
          unzip -q "$RUNNER_TEMP/uvcpp.zip" -d "$RUNNER_TEMP/uvcpp"
          curl -fL --retry 3 -o "$RUNNER_TEMP/ffmpeg.zip" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          unzip -q "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/ffmpeg"

      - name: Build backend
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUVNVR_LIBUVCPP_ROOT="$RUNNER_TEMP/uvcpp/libuvcpp-1.8.1-mingw-x64"
          cmake --build build --parallel

      - name: Stage portable tree
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ROOT="$(pwd)"
          OUT="$ROOT/dist-packages/uvnvr-${VERSION}-windows-x64"
          mkdir -p "$OUT/bin" "$OUT/share/uvnvr/frontend/dist"
          cp build/uvnvr.exe "$OUT/bin/"
          FFMPEG_EXE="$(find "$RUNNER_TEMP/ffmpeg" -type f -name ffmpeg.exe | head -1)"
          if "$FFMPEG_EXE" -buildconf 2>/dev/null | grep -q -- '--enable-gpl'; then
            echo "refusing to package a GPL FFmpeg build" >&2
            exit 1
          fi
          cp "$FFMPEG_EXE" "$OUT/bin/ffmpeg.exe"
          cp -a frontend/dist/. "$OUT/share/uvnvr/frontend/dist/"
          cp packaging/windows/uvnvr.portable.json "$OUT/uvnvr.json"
          cp LICENSE THIRD_PARTY_NOTICES.md "$OUT/"
          cp /mingw64/bin/libuvcpp.dll "$OUT/bin/" 2>/dev/null || true
          for dll in libuv.dll libssl-3-x64.dll libcrypto-3-x64.dll libwinpthread-1.dll libgcc_s_seh-1.dll libstdc++-6.dll zlib1.dll; do
            if [ -f "/mingw64/bin/$dll" ]; then cp "/mingw64/bin/$dll" "$OUT/bin/"; fi
          done
          if [ -f "$RUNNER_TEMP/uvcpp/libuvcpp-1.8.1-mingw-x64/bin/libuvcpp.dll" ]; then
            cp "$RUNNER_TEMP/uvcpp/libuvcpp-1.8.1-mingw-x64/bin/libuvcpp.dll" "$OUT/bin/"
          fi
          # Copy every MinGW runtime DLL the executable actually links.
          ldd build/uvnvr.exe | awk '/=> \/mingw64/ {print $3}' | while read -r dll; do
            [ -n "$dll" ] && cp -L "$dll" "$OUT/bin/"
          done
          cd dist-packages
          zip -qr "uvnvr-${VERSION}-windows-x64.zip" "uvnvr-${VERSION}-windows-x64"
          makensis -V2 -DVERSION="$VERSION" -DARCH=x64 -DOUTDIR="$(cygpath -w "$ROOT/dist-packages")" -DSOURCE="$(cygpath -w "$OUT")" -DROOT="$(cygpath -w "$ROOT")" "$ROOT/packaging/windows/uvnvr.nsi"

      - uses: actions/upload-artifact@v7
        with:
          name: uvnvr-windows-x64
          path: |
            dist-packages/*.zip
            dist-packages/*.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9] ]]; then VERSION="$(cat VERSION)"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install build dependencies
        run: |
          brew install cmake ninja pkg-config openssl@3 libuv nghttp2 sqlite3 zlib dylibbundler nasm

      - name: Build libuvcpp 1.8.1
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/uvcpp.tar.gz"             https://github.com/Antruly/libuvcpp/archive/refs/tags/v1.8.1.tar.gz
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/uvcpp.tar.gz"
          cmake -S "$RUNNER_TEMP/libuvcpp-1.8.1" -B "$RUNNER_TEMP/uvcpp-build" -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/uvcpp-install"             -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3);$(brew --prefix libuv);$(brew --prefix nghttp2)"             -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON -DUVCPP_ENABLE_DB=ON             -DUVCPP_ENABLE_NGHTTP2=ON -DUVCPP_ENABLE_OPENSSL=ON -DUVCPP_ENABLE_ZLIB=ON -DUVCPP_BUILD_TESTS=OFF -DUVCPP_BUILD_EXAMPLES=OFF -DUVCPP_BUILD_BENCH=OFF
          cmake --build "$RUNNER_TEMP/uvcpp-build" --target install --parallel

      - name: Build static LGPL FFmpeg
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz"             https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/ffmpeg.tar.xz"
          cd "$RUNNER_TEMP/ffmpeg-7.1.1"
          ./configure --prefix="$RUNNER_TEMP/ffmpeg" --disable-debug --disable-doc --disable-gpl --disable-nonfree --disable-shared --enable-static --disable-everything --disable-autodetect --disable-programs --enable-ffmpeg --disable-ffplay --disable-ffprobe --enable-videotoolbox --enable-audiotoolbox --enable-protocol=file,pipe,rtsp,tcp,udp --enable-demuxer=rtsp,mpegts,h264,hevc,mjpeg,rawvideo --enable-muxer=mpegts,mp4,mjpeg,rawvideo --enable-decoder=h264,hevc,mjpeg,rawvideo,aac --enable-encoder=mjpeg,rawvideo,aac --enable-parser=h264,hevc,mjpeg --enable-bsf=h264_mp4toannexb,hevc_mp4toannexb,aac_adtstoasc --enable-filter=scale,format,fps,aresample --enable-swscale
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Build backend
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release             -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/uvcpp-install;$(brew --prefix openssl@3);$(brew --prefix libuv);$(brew --prefix nghttp2)"             -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build build --parallel

      - name: Package
        timeout-minutes: 25
        run: |
          chmod +x packaging/macos/build-macos.sh
          packaging/macos/build-macos.sh \
            --build build \
            --version "${GITHUB_REF_NAME#v}" \
            --arch "${{ matrix.arch }}" \
            --out dist-packages \
            --ffmpeg "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" \
            --search-path "$RUNNER_TEMP/uvcpp-install/lib" \
            --search-path "$(brew --prefix)/lib"

      - uses: actions/upload-artifact@v7
        with:
          name: uvnvr-macos-${{ matrix.arch }}
          path: |
            dist-packages/*.pkg
            dist-packages/*.dmg
            dist-packages/*.zip
          if-no-files-found: error

  windows-arm64:
    name: Windows arm64 (MSVC)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9] ]]; then VERSION="$(cat VERSION)"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Install vcpkg OpenSSL for arm64
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          & "$vcpkgRoot\vcpkg.exe" install openssl:arm64-windows --clean-after-build
      - name: Fetch dependencies
        shell: pwsh
        run: |
          curl.exe -fL --retry 3 -o "$env:RUNNER_TEMP\uvcpp.zip" "https://github.com/Antruly/libuvcpp/releases/download/v1.8.1/libuvcpp-1.8.1-msvc-arm64.zip"
          Expand-Archive "$env:RUNNER_TEMP\uvcpp.zip" -DestinationPath "$env:RUNNER_TEMP\uvcpp" -Force
          curl.exe -fL --retry 3 -o "$env:RUNNER_TEMP\ffmpeg.zip" "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-winarm64-lgpl-8.1.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
      - name: Build backend
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          cmake -S . -B build -A ARM64 -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=arm64-windows -DUVNVR_LIBUVCPP_ROOT="$env:RUNNER_TEMP\uvcpp\libuvcpp-1.8.1-msvc-arm64"
          cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        env:
          UVNVR_VERSION: ${{ steps.version.outputs.version }}
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-arm64.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: uvnvr-windows-arm64
          path: |
            dist-packages/*.zip
            dist-packages/*.exe
          if-no-files-found: error

  release:
    name: GitHub release
    # Publish only when every platform job produced its artifacts; a failed
    # matrix must not leave a release with a partial asset set.
    if: startsWith(github.ref, 'refs/tags/v') && success()
    needs: [linux, windows-x64, windows-arm64, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.zip' \
               -o -name '*.exe' -o -name '*.pkg' -o -name '*.dmg' -o -name '*.tar.xz' \) \
            -exec cp -v {} release-assets/ \;

      - name: Attach FFmpeg source offer
        run: |
          curl -fL --retry 3 -o release-assets/ffmpeg-source-46d899d7a0.tar.gz \
            https://github.com/FFmpeg/FFmpeg/archive/46d899d7a0.tar.gz
          curl -fL --retry 3 -o release-assets/FFmpeg-LGPLv3.txt \
            https://raw.githubusercontent.com/FFmpeg/FFmpeg/46d899d7a0/COPYING.LGPLv3

      - name: Generate SBOM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > "release-assets/uvnvr-${VERSION}-sbom.spdx.json" <<EOF
          {
            "spdxVersion": "SPDX-2.3",
            "dataLicense": "CC0-1.0",
            "name": "UvNVR ${VERSION}",
            "documentNamespace": "https://github.com/Antruly/uvnvr/releases/${GITHUB_REF_NAME}",
            "packages": [
              {"name": "UvNVR", "SPDXID": "SPDXRef-Package-UvNVR", "licenseConcluded": "MIT"},
              {"name": "libuvcpp", "SPDXID": "SPDXRef-Package-libuvcpp", "licenseConcluded": "MIT"},
              {"name": "FFmpeg", "SPDXID": "SPDXRef-Package-FFmpeg", "licenseConcluded": "LGPL-3.0-or-later"},
              {"name": "OpenSSL", "SPDXID": "SPDXRef-Package-OpenSSL", "licenseConcluded": "Apache-2.0"},
              {"name": "SQLite", "SPDXID": "SPDXRef-Package-SQLite", "licenseConcluded": "CC0-1.0"}
            ]
          }
          EOF

      - name: Generate checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | sort | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh release-assets
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --clobber release-assets/*
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "UvNVR ${GITHUB_REF_NAME}" \
              --draft \
              --generate-notes \
              release-assets/*
          fi
