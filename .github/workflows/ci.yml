name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install build tools
        run: |
          # The runner image's apt mirror intermittently 404s on a single
          # package; retry instead of failing the whole job.
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=5 || true
            if sudo apt-get install -y --no-install-recommends \
                 ninja-build pkg-config unzip libuv1-dev libssl-dev \
                 nlohmann-json3-dev python3-websockets ffmpeg; then
              exit 0
            fi
            sleep 20
          done
          exit 1

      - name: Fetch libuvcpp 1.8.1
        run: |
          curl -fL --retry 3 --max-time 180 \
            -o "$RUNNER_TEMP/libuvcpp.zip" \
            https://github.com/Antruly/libuvcpp/releases/download/v1.8.1/libuvcpp-1.8.1-linux-x64.zip
          unzip -q "$RUNNER_TEMP/libuvcpp.zip" -d "$RUNNER_TEMP/uvcpp"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUVNVR_LIBUVCPP_ROOT="$RUNNER_TEMP/uvcpp/libuvcpp-1.8.1-linux-x64"

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke test
        run: |
          set -euo pipefail
          ./build/uvnvr --port 18080 > "$RUNNER_TEMP/uvnvr.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/healthz > "$RUNNER_TEMP/health.json"; then
              break
            fi
            sleep 0.5
          done

          cat "$RUNNER_TEMP/health.json"
          grep -q "\"version\":\"$(cat VERSION)\"" "$RUNNER_TEMP/health.json"
          curl -fsS http://127.0.0.1:18080/ | grep -q '<title>UvNVR</title>'
          echo "smoke test passed"

      - name: M1 integration test
        run: bash tests/integration/m1_auth.sh ./build/uvnvr 18090

      - name: Session revocation integration test
        run: bash tests/integration/session_revocation.sh ./build/uvnvr 18110

      - name: Configuration integration test
        run: bash tests/integration/config.sh ./build/uvnvr 18200

      - name: Playback integration test
        run: python3 tests/integration/playback.py ./build/uvnvr 18300

      - name: Channel groups and layouts integration test
        run: python3 tests/integration/groups_layouts.py ./build/uvnvr 18400

      - name: Channel creation integration test
        run: python3 tests/integration/channel_add.py ./build/uvnvr 18610

      - name: ONVIF events integration test
        run: python3 tests/integration/onvif_events.py ./build/uvnvr 18810

      - name: API token scopes integration test
        run: python3 tests/integration/token_scopes.py ./build/uvnvr 19210

      - name: Brand HTTP digest integration test
        run: python3 tests/integration/brand_http.py ./build/uvnvr 19810

      - name: ONVIF encoder integration test
        run: python3 tests/integration/onvif_encoder.py ./build/uvnvr 19410

      - name: Fetch MediaMTX test fixture
        run: |
          curl -fL --retry 3 --max-time 180 \
            -o "$RUNNER_TEMP/mediamtx.tar.gz" \
            https://github.com/bluenviron/mediamtx/releases/download/v1.21.2/mediamtx_v1.21.2_linux_amd64.tar.gz
          mkdir -p "$RUNNER_TEMP/mediamtx"
          tar -C "$RUNNER_TEMP/mediamtx" -xzf "$RUNNER_TEMP/mediamtx.tar.gz"

      - name: Recording integration test
        env:
          MEDIAMTX_BIN: ${{ runner.temp }}/mediamtx/mediamtx
        run: python3 tests/integration/recording.py ./build/uvnvr 19510

      - name: Event recording integration test
        env:
          MEDIAMTX_BIN: ${{ runner.temp }}/mediamtx/mediamtx
        run: python3 tests/integration/event_recording.py ./build/uvnvr 19610

      - name: Active recording playback integration test
        env:
          MEDIAMTX_BIN: ${{ runner.temp }}/mediamtx/mediamtx
        run: python3 tests/integration/active_playback.py ./build/uvnvr 19110

      - name: RTSP output integration test
        env:
          MEDIAMTX_BIN: ${{ runner.temp }}/mediamtx/mediamtx
        run: python3 tests/integration/rtsp_output.py ./build/uvnvr 19710

      - name: Maintenance integration test
        run: python3 tests/integration/maintenance.py ./build/uvnvr 19910

      - name: Configure channel ACL build
        run: |
          cmake -S . -B build-acl -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUVNVR_LIBUVCPP_ROOT="$RUNNER_TEMP/uvcpp/libuvcpp-1.8.1-linux-x64" \
            -DUVNVR_ENABLE_CHANNEL_ACL=ON \
            -DUVNVR_BUILD_TESTS=ON

      - name: Build channel ACL configuration
        run: cmake --build build-acl --parallel

      - name: Channel ACL unit tests
        run: ctest --test-dir build-acl --output-on-failure

      - name: Channel ACL integration test
        run: bash tests/integration/channel_acl.sh ./build-acl/uvnvr 18097

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: uvnvr-server-log
          path: ${{ runner.temp }}/uvnvr.log
          if-no-files-found: ignore

  gm-tls:
    name: Linux x64 (GM/T 0024 via Tongsuo)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build pkg-config unzip libuv1-dev nlohmann-json3-dev

      - name: Build Tongsuo
        run: |
          git clone --depth 1 https://github.com/Tongsuo-Project/Tongsuo.git "$RUNNER_TEMP/tongsuo"
          cd "$RUNNER_TEMP/tongsuo"
          ./config --prefix="$RUNNER_TEMP/tongsuo-install" enable-ntls no-tests shared
          make -j"$(nproc)"
          make install_sw

      - name: Fetch libuvcpp 1.8.1
        run: |
          curl -fL --retry 3 --max-time 180 \
            -o "$RUNNER_TEMP/libuvcpp.zip" \
            https://github.com/Antruly/libuvcpp/releases/download/v1.8.1/libuvcpp-1.8.1-linux-x64.zip
          unzip -q "$RUNNER_TEMP/libuvcpp.zip" -d "$RUNNER_TEMP/uvcpp"

      - name: Configure
        run: |
          cmake -S . -B build-gm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUVNVR_LIBUVCPP_ROOT="$RUNNER_TEMP/uvcpp/libuvcpp-1.8.1-linux-x64" \
            -DUVNVR_ENABLE_GM_TLS=ON \
            -DUVNVR_GM_TLS_ROOT="$RUNNER_TEMP/tongsuo-install" \
            -DUVNVR_BUILD_TESTS=ON \
            -DUVNVR_BUILD_SDK=OFF

      - name: Build
        run: cmake --build build-gm --parallel

      - name: GM TLS handshake test
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/tongsuo-install/lib64:${{ runner.temp }}/tongsuo-install/lib
        run: |
          ./build-gm/tests/gm_tls_test | tee "$RUNNER_TEMP/gm_tls.log"
          grep -q "cipher=ECDHE-SM2-SM4-CBC-SM3" "$RUNNER_TEMP/gm_tls.log"
          grep -q "cipher=TLS_SM4_GCM_SM3" "$RUNNER_TEMP/gm_tls.log"

  windows-gm-tls:
    name: Windows x64 (GM/T 0024 via Tongsuo)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libuv
            mingw-w64-x86_64-openssl
            unzip

      - name: Build Tongsuo
        run: |
          ok=0
          for url in https://codeload.github.com/Tongsuo-Project/Tongsuo/zip/refs/heads/master \
                     https://gitee.com/mirrors/Tongsuo/repository/archive/master.zip; do
            for i in 1 2 3; do
              rm -rf /tmp/tongsuo.zip /tmp/tongsuo-src
              curl -fsSL --max-time 600 -o /tmp/tongsuo.zip "$url" || continue
              if unzip -qt /tmp/tongsuo.zip >/dev/null 2>&1; then ok=1; break 2; fi
            done
          done
          [ "$ok" = 1 ] || { echo "cannot download Tongsuo"; exit 1; }
          mkdir -p /tmp/tongsuo-src && unzip -q /tmp/tongsuo.zip -d /tmp/tongsuo-src
          SRC=$(find /tmp/tongsuo-src -maxdepth 1 -mindepth 1 -type d | head -1)
          cd "$SRC"
          ./config --prefix=/tmp/tongsuo-install enable-ntls no-tests no-docs
          make -j"$(nproc)"
          make install_sw
          echo "TONGS=$(cygpath -w /tmp/tongsuo-install)" >> "$GITHUB_ENV"

      - name: Fetch libuvcpp
        run: |
          curl -fL --retry 3 --max-time 300 -o /tmp/uvcpp.zip \
            https://github.com/Antruly/libuvcpp/releases/download/v1.8.1/libuvcpp-1.8.1-mingw-x64.zip
          unzip -q /tmp/uvcpp.zip -d /tmp/uvcpp
          echo "UVCPP=$(cygpath -w "$(find /tmp/uvcpp -maxdepth 1 -mindepth 1 -type d | head -1)")" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build-gm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUVNVR_LIBUVCPP_ROOT="$UVCPP" \
            -DUVNVR_ENABLE_GM_TLS=ON -DUVNVR_GM_TLS_ROOT="$TONGS" \
            -DOPENSSL_ROOT_DIR="$TONGS" \
            -DUVNVR_ENABLE_GB28181=ON \
            -DUVNVR_BUILD_TESTS=ON -DUVNVR_BUILD_SDK=OFF

      - name: Build
        run: cmake --build build-gm --parallel --target gm_tls_test sip_gm_tls_test

      - name: GM TLS handshake test
        run: |
          ./build-gm/tests/gm_tls_test.exe | tee /tmp/gm.log
          grep -q "cipher=ECDHE-SM2-SM4-CBC-SM3" /tmp/gm.log
          ./build-gm/tests/sip_gm_tls_test.exe | tee /tmp/sip-gm.log
          grep -q "registered=yes" /tmp/sip-gm.log
          grep -q "all checks passed" /tmp/sip-gm.log
