name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install build tools
        run: sudo apt-get install -y --no-install-recommends ninja-build pkg-config unzip

      - name: Fetch libuvcpp 1.8.1
        run: |
          curl -fL --retry 3 --max-time 180 \
            -o "$RUNNER_TEMP/libuvcpp.zip" \
            https://github.com/Antruly/libuvcpp/releases/download/v1.8.1/libuvcpp-1.8.1-linux-x64.zip
          unzip -q "$RUNNER_TEMP/libuvcpp.zip" -d "$RUNNER_TEMP/uvcpp"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUVNVR_LIBUVCPP_ROOT="$RUNNER_TEMP/uvcpp/libuvcpp-1.8.1-linux-x64"

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke test
        run: |
          set -euo pipefail
          ./build/uvnvr --port 18080 > "$RUNNER_TEMP/uvnvr.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/healthz > "$RUNNER_TEMP/health.json"; then
              break
            fi
            sleep 0.5
          done

          cat "$RUNNER_TEMP/health.json"
          grep -q '"version":"0.1.0"' "$RUNNER_TEMP/health.json"
          curl -fsS http://127.0.0.1:18080/ | grep -q '<title>UvNVR</title>'
          echo "smoke test passed"

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: uvnvr-server-log
          path: ${{ runner.temp }}/uvnvr.log
          if-no-files-found: ignore
