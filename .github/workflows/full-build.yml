name: Full build

# Feature-complete packages: AI (HyperLPR3 + InspireFace), GB/T 28181,
# GB 35114, security hardening. The regular release keeps all of these off by
# default so a plain install stays lean; this workflow produces the variant
# that actually carries them.

on:
  workflow_dispatch:
  push:
    tags: ['v*-full']

permissions:
  contents: read

jobs:
  linux-x64-full:
    name: Linux x64 full
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=5 || true
            if sudo apt-get install -y --no-install-recommends \
                 ninja-build pkg-config unzip libuv1-dev libssl-dev \
                 libopencv-dev nlohmann-json3-dev python3-websockets ffmpeg; then
              exit 0
            fi
            sleep 20
          done
          exit 1

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Fetch libuvcpp
        run: |
          curl -fL --retry 3 --max-time 180 -o "$RUNNER_TEMP/uvcpp.zip" \
            https://github.com/Antruly/libuvcpp/releases/download/v1.8.1/libuvcpp-1.8.1-linux-x64.zip
          unzip -q "$RUNNER_TEMP/uvcpp.zip" -d "$RUNNER_TEMP/uvcpp"

      - name: Build MNN
        run: |
          curl -fL --retry 3 --max-time 600 -o "$RUNNER_TEMP/mnn.zip" \
            https://gitee.com/alibaba/MNN/repository/archive/master.zip
          unzip -q "$RUNNER_TEMP/mnn.zip" -d "$RUNNER_TEMP/mnn-src"
          MNN_DIR=$(find "$RUNNER_TEMP/mnn-src" -maxdepth 1 -mindepth 1 -type d | head -1)
          cmake -S "$MNN_DIR" -B "$MNN_DIR/build" \
            -DCMAKE_BUILD_TYPE=Release -DMNN_BUILD_SHARED_LIBS=ON \
            -DMNN_BUILD_TEST=OFF -DMNN_BUILD_TOOLS=OFF -DMNN_BUILD_CONVERTER=OFF
          cmake --build "$MNN_DIR/build" -j"$(nproc)"
          echo "MNN_ROOT=$MNN_DIR" >> "$GITHUB_ENV"

      - name: Fetch models
        run: |
          mkdir -p "$RUNNER_TEMP/models/hyperlpr3" "$RUNNER_TEMP/models/face"
          for f in b320_backbone_h b320_header_h b640x_backbone_h b640x_head_h \
                   litemodel_cls_96xh rpv3_mdict_160h; do
            curl -fsSL --retry 3 --max-time 180 \
              -H "Accept: application/vnd.github.raw" \
              -o "$RUNNER_TEMP/models/hyperlpr3/$f.mnn" \
              "https://api.github.com/repos/szad670401/HyperLPR/contents/resource/models/r2_mobile/$f.mnn?ref=master"
          done
          ls -l "$RUNNER_TEMP/models/hyperlpr3"

      - name: Fetch InspireFace
        run: |
          curl -fL --retry 3 --max-time 300 -o "$RUNNER_TEMP/if.zip" \
            https://github.com/HyperInspire/InspireFace/releases/download/v1.2.4/inspireface-linux-x86-ubuntu18-1.2.4.zip
          unzip -q "$RUNNER_TEMP/if.zip" -d "$RUNNER_TEMP/if"
          IF_DIR=$(dirname "$(dirname "$(find "$RUNNER_TEMP/if" -name inspireface.h | head -1)")")
          echo "IF_ROOT=$IF_DIR" >> "$GITHUB_ENV"
          curl -fL --retry 3 --max-time 300 -o "$RUNNER_TEMP/models/face/Pikachu" \
            https://github.com/HyperInspire/InspireFace/releases/download/v1.x/Pikachu

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_BUILD_RPATH='$ORIGIN/../lib' \
            -DUVNVR_LIBUVCPP_ROOT="$RUNNER_TEMP/uvcpp/libuvcpp-1.8.1-linux-x64" \
            -DUVNVR_BUILD_TESTS=ON -DUVNVR_BUILD_TOOLS=ON \
            -DUVNVR_ENABLE_GB28181=ON -DUVNVR_ENABLE_GB35114=ON \
            -DUVNVR_ENABLE_SECURE=ON -DUVNVR_ENABLE_CHANNEL_ACL=ON \
            -DUVNVR_ENABLE_CONFIG_INTEGRITY=ON \
            -DUVNVR_ENABLE_AI=ON -DUVNVR_ENABLE_HYPERLPR=ON \
            -DUVNVR_MNN_ROOT="$MNN_ROOT" \
            -DUVNVR_ENABLE_INSPIREFACE=ON -DUVNVR_INSPIREFACE_ROOT="$IF_ROOT"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          LD_LIBRARY_PATH: ${{ env.IF_ROOT }}/lib:${{ env.MNN_ROOT }}/build
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          OUT="$RUNNER_TEMP/uvnvr-full"
          mkdir -p "$OUT"/{bin,lib,share/uvnvr/frontend,models/hyperlpr3,models/face}
          install -m 0755 build/uvnvr build/hlpr_cli "$OUT/bin/"
          cp -P "$MNN_ROOT"/build/libMNN.so* "$OUT/lib/"
          cp -P "$IF_ROOT"/lib/libInspireFace.so "$OUT/lib/"
          cp -a frontend/dist/. "$OUT/share/uvnvr/frontend/"
          cp "$RUNNER_TEMP"/models/hyperlpr3/*.mnn "$OUT/models/hyperlpr3/"
          cp "$RUNNER_TEMP/models/face/Pikachu" "$OUT/models/face/Pikachu"
          printf '%s\n' '#!/bin/sh' \
            'HERE=$(cd "$(dirname "$0")" && pwd)' \
            'export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec "$HERE/bin/uvnvr" "$@"' > "$OUT/uvnvr-full.sh"
          chmod 0755 "$OUT/uvnvr-full.sh"
          VERSION=$(cat VERSION)
          tar -C "$RUNNER_TEMP" -czf "uvnvr-$VERSION-full-linux-x64.tar.gz" uvnvr-full
          sha256sum "uvnvr-$VERSION-full-linux-x64.tar.gz" > "uvnvr-$VERSION-full-linux-x64.tar.gz.sha256"
          cat "uvnvr-$VERSION-full-linux-x64.tar.gz.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: uvnvr-full-linux-x64
          path: |
            uvnvr-*-full-linux-x64.tar.gz
            uvnvr-*-full-linux-x64.tar.gz.sha256
          if-no-files-found: error
