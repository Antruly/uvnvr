name: Full build

# Feature-complete packages: AI (HyperLPR3 + InspireFace), GB/T 28181,
# GB 35114, security hardening. The regular release keeps all of these off by
# default so a plain install stays lean; this workflow produces the variant
# that actually carries them.

on:
  workflow_dispatch:
  push:
    tags: ['v*-full']

permissions:
  contents: read

jobs:
  linux-x64-full:
    name: Linux x64 full
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=5 || true
            if sudo apt-get install -y --no-install-recommends \
                 ninja-build pkg-config unzip libuv1-dev libssl-dev \
                 libopencv-dev nlohmann-json3-dev python3-websockets ffmpeg; then
              exit 0
            fi
            sleep 20
          done
          exit 1

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Fetch libuvcpp
        run: |
          curl -fL --retry 3 --max-time 180 -o "$RUNNER_TEMP/uvcpp.zip" \
            https://github.com/Antruly/libuvcpp/releases/download/v1.8.1/libuvcpp-1.8.1-linux-x64.zip
          unzip -q "$RUNNER_TEMP/uvcpp.zip" -d "$RUNNER_TEMP/uvcpp"

      - name: Build MNN
        run: |
          # codeload is on GitHub's own network; Gitee is the fallback for
          # networks that cannot reach it, retried until the archive is whole.
          ok=0
          for url in https://codeload.github.com/alibaba/MNN/zip/refs/heads/master \
                     https://gitee.com/alibaba/MNN/repository/archive/master.zip; do
            for i in 1 2 3; do
              rm -f "$RUNNER_TEMP/mnn.zip"
              curl -fsSL --max-time 600 -o "$RUNNER_TEMP/mnn.zip" "$url" || continue
              if unzip -tq "$RUNNER_TEMP/mnn.zip" >/dev/null 2>&1; then ok=1; break 2; fi
            done
          done
          [ "$ok" = 1 ] || { echo "cannot download MNN"; exit 1; }
          unzip -q "$RUNNER_TEMP/mnn.zip" -d "$RUNNER_TEMP/mnn-src"
          MNN_DIR=$(find "$RUNNER_TEMP/mnn-src" -maxdepth 1 -mindepth 1 -type d | head -1)
          cmake -S "$MNN_DIR" -B "$MNN_DIR/build" \
            -DCMAKE_BUILD_TYPE=Release -DMNN_BUILD_SHARED_LIBS=ON \
            -DMNN_BUILD_TEST=OFF -DMNN_BUILD_TOOLS=OFF -DMNN_BUILD_CONVERTER=OFF
          cmake --build "$MNN_DIR/build" -j"$(nproc)"
          echo "MNN_ROOT=$MNN_DIR" >> "$GITHUB_ENV"

      - name: Fetch models
        run: |
          mkdir -p "$RUNNER_TEMP/models/hyperlpr3" "$RUNNER_TEMP/models/face"
          for f in b320_backbone_h b320_header_h b640x_backbone_h b640x_head_h \
                   litemodel_cls_96xh rpv3_mdict_160h; do
            # raw.githubusercontent.com is a CDN and does not hit the API rate
            # limit the way the contents endpoint does.
            curl -fsSL --retry 3 --max-time 180 \
              -o "$RUNNER_TEMP/models/hyperlpr3/$f.mnn" \
              "https://raw.githubusercontent.com/szad670401/HyperLPR/master/resource/models/r2_mobile/$f.mnn"
          done
          ls -l "$RUNNER_TEMP/models/hyperlpr3"

      - name: Fetch InspireFace
        run: |
          curl -fL --retry 3 --max-time 300 -o "$RUNNER_TEMP/if.zip" \
            https://github.com/HyperInspire/InspireFace/releases/download/v1.2.4/inspireface-linux-x86-ubuntu18-1.2.4.zip
          unzip -q "$RUNNER_TEMP/if.zip" -d "$RUNNER_TEMP/if"
          IF_DIR=$(dirname "$(dirname "$(find "$RUNNER_TEMP/if" -name inspireface.h | head -1)")")
          echo "IF_ROOT=$IF_DIR" >> "$GITHUB_ENV"
          curl -fL --retry 3 --max-time 300 -o "$RUNNER_TEMP/models/face/Pikachu" \
            https://github.com/HyperInspire/InspireFace/releases/download/v1.x/Pikachu

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_BUILD_RPATH='$ORIGIN/../lib' \
            -DUVNVR_LIBUVCPP_ROOT="$RUNNER_TEMP/uvcpp/libuvcpp-1.8.1-linux-x64" \
            -DUVNVR_BUILD_TESTS=ON -DUVNVR_BUILD_TOOLS=ON \
            -DUVNVR_ENABLE_GB28181=ON -DUVNVR_ENABLE_GB35114=ON \
            -DUVNVR_ENABLE_SECURE=ON -DUVNVR_ENABLE_CHANNEL_ACL=ON \
            -DUVNVR_ENABLE_CONFIG_INTEGRITY=ON \
            -DUVNVR_ENABLE_AI=ON -DUVNVR_ENABLE_HYPERLPR=ON \
            -DUVNVR_MNN_ROOT="$MNN_ROOT" \
            -DUVNVR_ENABLE_INSPIREFACE=ON -DUVNVR_INSPIREFACE_ROOT="$IF_ROOT"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          LD_LIBRARY_PATH: ${{ env.IF_ROOT }}/lib:${{ env.MNN_ROOT }}/build
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          OUT="$RUNNER_TEMP/uvnvr-full"
          mkdir -p "$OUT"/{bin,lib,share/uvnvr/frontend,models/hyperlpr3,models/face}
          install -m 0755 build/uvnvr build/hlpr_cli "$OUT/bin/"
          cp -P "$MNN_ROOT"/build/libMNN.so* "$OUT/lib/"
          cp -P "$IF_ROOT"/lib/libInspireFace.so "$OUT/lib/"
          cp -a frontend/dist/. "$OUT/share/uvnvr/frontend/"
          cp "$RUNNER_TEMP"/models/hyperlpr3/*.mnn "$OUT/models/hyperlpr3/"
          cp "$RUNNER_TEMP/models/face/Pikachu" "$OUT/models/face/Pikachu"
          printf '%s\n' '#!/bin/sh' \
            'HERE=$(cd "$(dirname "$0")" && pwd)' \
            'export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec "$HERE/bin/uvnvr" "$@"' > "$OUT/uvnvr-full.sh"
          chmod 0755 "$OUT/uvnvr-full.sh"
          VERSION=$(cat VERSION)
          tar -C "$RUNNER_TEMP" -czf "uvnvr-$VERSION-full-linux-x64.tar.gz" uvnvr-full
          sha256sum "uvnvr-$VERSION-full-linux-x64.tar.gz" > "uvnvr-$VERSION-full-linux-x64.tar.gz.sha256"
          cat "uvnvr-$VERSION-full-linux-x64.tar.gz.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: uvnvr-full-linux-x64
          path: |
            uvnvr-*-full-linux-x64.tar.gz
            uvnvr-*-full-linux-x64.tar.gz.sha256
          if-no-files-found: error

  windows-x64-full:
    name: Windows x64 full
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-opencv
            mingw-w64-x86_64-libuv
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-ntldd
            unzip
            zip

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Fetch libuvcpp
        run: |
          curl -fL --retry 3 --max-time 300 -o /tmp/uvcpp.zip \
            https://github.com/Antruly/libuvcpp/releases/download/v1.8.1/libuvcpp-1.8.1-mingw-x64.zip
          unzip -q /tmp/uvcpp.zip -d /tmp/uvcpp

      - name: Build MNN
        run: |
          ok=0
          for url in https://codeload.github.com/alibaba/MNN/zip/refs/heads/master \
                     https://gitee.com/alibaba/MNN/repository/archive/master.zip; do
            for i in 1 2 3; do
              rm -f /tmp/mnn.zip
              curl -fsSL --max-time 600 -o /tmp/mnn.zip "$url" || continue
              if unzip -tq /tmp/mnn.zip >/dev/null 2>&1; then ok=1; break 2; fi
            done
          done
          [ "$ok" = 1 ] || { echo "cannot download MNN"; exit 1; }
          unzip -q /tmp/mnn.zip -d /tmp/mnn-src
          MNN_DIR=$(find /tmp/mnn-src -maxdepth 1 -mindepth 1 -type d | head -1)
          cmake -S "$MNN_DIR" -B "$MNN_DIR/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DMNN_BUILD_SHARED_LIBS=ON \
            -DMNN_BUILD_TEST=OFF -DMNN_BUILD_TOOLS=OFF -DMNN_BUILD_CONVERTER=OFF
          cmake --build "$MNN_DIR/build" -j"$(nproc)"
          echo "MNN_DIR=$MNN_DIR" >> "$GITHUB_ENV"

      - name: Fetch models
        run: |
          mkdir -p /tmp/models/hyperlpr3 /tmp/models/face
          for f in b320_backbone_h b320_header_h b640x_backbone_h b640x_head_h \
                   litemodel_cls_96xh rpv3_mdict_160h; do
            curl -fsSL --retry 3 --max-time 180 \
              -o "/tmp/models/hyperlpr3/$f.mnn" \
              "https://raw.githubusercontent.com/szad670401/HyperLPR/master/resource/models/r2_mobile/$f.mnn"
          done

      - name: Fetch InspireFace
        run: |
          curl -fL --retry 3 --max-time 300 -o /tmp/if.zip \
            https://github.com/HyperInspire/InspireFace/releases/download/v1.2.4/inspireface-windows-x64-1.2.4.zip
          unzip -q /tmp/if.zip -d /tmp/if
          echo "IF_ROOT=$(find /tmp/if -maxdepth 2 -name InspireFace -type d | head -1)" >> "$GITHUB_ENV"
          curl -fL --retry 3 --max-time 300 -o /tmp/models/face/Pikachu \
            https://github.com/HyperInspire/InspireFace/releases/download/v1.x/Pikachu

      - name: Configure
        run: |
          UVCPP_DIR=$(find /tmp/uvcpp -maxdepth 1 -mindepth 1 -type d | head -1)
          echo "UVCPP_DIR=$UVCPP_DIR" >> "$GITHUB_ENV"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUVNVR_LIBUVCPP_ROOT="$(cygpath -w "$UVCPP_DIR")" \
            -DUVNVR_BUILD_TESTS=OFF -DUVNVR_BUILD_TOOLS=ON -DUVNVR_BUILD_SDK=OFF \
            -DUVNVR_ENABLE_GB28181=ON -DUVNVR_ENABLE_GB35114=ON \
            -DUVNVR_ENABLE_SECURE=ON -DUVNVR_ENABLE_CHANNEL_ACL=ON \
            -DUVNVR_ENABLE_CONFIG_INTEGRITY=ON \
            -DUVNVR_ENABLE_AI=ON -DUVNVR_ENABLE_HYPERLPR=ON \
            -DUVNVR_MNN_ROOT="$(cygpath -w "$MNN_DIR")" \
            -DUVNVR_ENABLE_INSPIREFACE=ON \
            -DUVNVR_INSPIREFACE_ROOT="$(cygpath -w "$IF_ROOT")"

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          OUT="$RUNNER_TEMP/uvnvr-full-win"
          mkdir -p "$OUT"/{bin,models/hyperlpr3,models/face,share/uvnvr/frontend}
          cp build/uvnvr.exe build/hlpr_cli.exe "$OUT/bin/"
          # OpenCV 5 pulls a deep dependency chain (tbb, jxl, OpenEXR, ...), so
          # walk the imports until nothing new appears instead of copying only
          # the executable's direct dependencies.
          changed=1
          while [ "$changed" = 1 ]; do
            changed=0
            for f in "$OUT"/bin/*.exe "$OUT"/bin/*.dll; do
              for dll in $(ldd "$f" 2>/dev/null | awk '/mingw64/ {print $3}'); do
                base=$(basename "$dll")
                if [ ! -f "$OUT/bin/$base" ]; then
                  cp "$dll" "$OUT/bin/" && changed=1
                fi
              done
            done
          done
          ls "$OUT/bin" | wc -l
          cp "$MNN_DIR"/build/libMNN.dll "$OUT/bin/"
          cp "$IF_ROOT"/lib/libInspireFace.dll "$OUT/bin/"
          cp "$UVCPP_DIR"/bin/libuvcpp.dll "$OUT/bin/"

          # Fail the job if any import is still unresolved, instead of shipping
          # a package that silently refuses to start.
          missing=0
          for exe in "$OUT"/bin/*.exe; do
            for name in $(objdump -p "$exe" | awk '/DLL Name:/ {print $3}'); do
              case "$name" in
                KERNEL32.dll|USER32.dll|ADVAPI32.dll|CRYPT32.dll|WS2_32.dll|SHELL32.dll| \
                ole32.dll|OLE32.dll|msvcrt.dll|api-ms-*|bcrypt.dll|iphlpapi.dll|userenv.dll| \
                wtsapi32.dll|gdi32.dll|comctl32.dll|SHLWAPI.dll|WINMM.dll|dbghelp.dll|pdh.dll| \
                psapi.dll|secur32.dll|version.dll|winhttp.dll|wininet.dll|ntdll.dll|NETAPI32.dll)
                  continue ;;
              esac
              if [ ! -f "$OUT/bin/$name" ]; then
                echo "missing $name (needed by $(basename "$exe"))"
                missing=1
              fi
            done
          done
          [ "$missing" = 0 ]
          cp /tmp/models/hyperlpr3/*.mnn "$OUT/models/hyperlpr3/"
          cp /tmp/models/face/Pikachu "$OUT/models/face/Pikachu"
          cp -a frontend/dist/. "$OUT/share/uvnvr/frontend/"
          # RUNNER_TEMP is visible to the PowerShell-based upload action,
          # while MSYS2's /tmp is not.
          cd "$RUNNER_TEMP" && zip -qr uvnvr-full-windows-x64.zip uvnvr-full-win
          sha256sum uvnvr-full-windows-x64.zip > uvnvr-full-windows-x64.zip.sha256
          cat uvnvr-full-windows-x64.zip.sha256

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: uvnvr-full-windows-x64
          path: |
            ${{ runner.temp }}/uvnvr-full-windows-x64.zip
            ${{ runner.temp }}/uvnvr-full-windows-x64.zip.sha256
          if-no-files-found: error
