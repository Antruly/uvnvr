name: Feature request
description: Propose a capability or an improvement
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you expect. Mention if it maps to a milestone in docs/development-plan.md.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Camera / ONVIF / RTSP ingest
        - Live preview
        - Recording / storage
        - Playback
        - RTSP output / API
        - Alerts / analytics
        - Users / permissions / audit
        - UI / i18n
        - Packaging / platform
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the development plan.
          required: true
